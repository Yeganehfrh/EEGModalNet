[project]
name = "YARE-GAN"
version = "0.1.0"
requires-python = ">=3.12"

[flake8]
ignore=["E501"]
max-line-length=160

[pytest]
addopts = "-ra -q"
testpaths = ["src"]
python_files = ["*_test.py"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]

[tool.pixi.tasks]

[tool.pixi.dependencies]
pytorch = ">=2.7.1,<3"
keras = ">=3.10.0,<4"
pytest = ">=8.4.1,<9"
pip = ">=25.1.1,<26"
torchvision = ">=0.22.0,<0.23"
seaborn = ">=0.13.2,<0.14"
pandas = ">=2.3.0,<3"
flake8 = ">=7.3.0,<8"
ipykernel = ">=6.29.5,<7"
xarray = ">=2025.7.0,<2026"
h5netcdf = ">=1.6.3,<2"
dvc = ">=3.60.1,<4"
scikit-learn = ">=1.7.0,<2"
umap-learn = ">=0.5.9.post2,<0.6"
tqdm = ">=4.67.1,<5"
ipywidgets = ">=8.1.7,<9"
meegkit = ">=0.1.9,<0.2"
mne = ">=1.9.0,<2"
